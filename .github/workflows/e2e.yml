name: E2E (Maestro)
# PR 머지 전 게이트에서 제외됨 (2026-09-10): EAS Free 플랜 Android 빌드 쿼터 소진 문제로
# 매 PR 클라우드 빌드를 중단했다. PR 작성자가 로컬에서 smoke를 실행하고 결과를 PR 본문에 첨부한다
# (docs/CONVENTIONS.md §8.4). CI는 nightly 회귀와 수동 실행만 담당하며, 빌드는 --local 이라 쿼터를 쓰지 않는다.
on:
  schedule:
    # 매일 KST 02:00 (UTC 17:00) — 전체 suite (smoke + regression)
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: "실행 대상 (smoke = 01~05, full = 전체)"
        type: choice
        options: [smoke, full]
        default: smoke

concurrency:
  group: e2e-${{ github.ref }}
  # nightly·수동은 서로 죽이지 않는다 (PR 트리거가 없어 cancel 대상이 없음)
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Maestro 버전 핀 — 로컬 개발자 머신과 동일 버전 유지 (docs/CONVENTIONS.md §8.5)
  MAESTRO_VERSION: "2.7.0"

jobs:
  e2e:
    name: E2E Smoke/Full (Android)
    runs-on: ubuntu-latest
    # --local 빌드(prebuild+gradle)가 러너에서 도므로 클라우드 대비 시간 여유를 둔다
    timeout-minutes: 90
    steps:
      - name: Resolve suite
        id: suite
        run: |
          # schedule = full, dispatch = 입력값(기본 smoke)
          case "${{ github.event_name }}" in
            schedule) suite="full" ;;
            *)        suite="${{ inputs.suite }}" ;;
          esac
          if [ "$suite" = "smoke" ]; then
            echo "tags=--include-tags smoke" >> "$GITHUB_OUTPUT"
          else
            echo "tags=" >> "$GITHUB_OUTPUT"
          fi
          echo "label=$suite" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
      - run: corepack enable
      # 로컬 gradle 빌드용 JDK 17 (AGP / RN 0.81 요구). 클라우드 EAS 빌드엔 불필요했으나 --local 은 러너에서 빌드한다
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: yarn
      - run: yarn install --immutable

      - name: Write Firebase config (dev, android)
        env:
          JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_DEV_BASE64 }}
        run: |
          mkdir -p config/dev/firebase
          echo "$JSON_B64" | base64 --decode > config/dev/firebase/google-services.json

      - name: EAS Build (preview, android, --local) → APK
        run: |
          # --local: 러너에서 prebuild + gradle 로 빌드 → EAS 클라우드 빌드 쿼터를 쓰지 않는다.
          # 서명 크레덴셜만 EXPO_TOKEN 으로 fetch (쿼터와 무관). preview 프로필은 developmentClient 미포함
          # (JS 번들 내장 → Metro 불필요). 산출물을 app.apk 로 직접 받는다 (클라우드 빌드의 URL 다운로드 불필요).
          eas build --profile preview --platform android --local --non-interactive --output "$PWD/app.apk"

      - name: Install Maestro (pinned)
        # MAESTRO_VERSION 은 workflow env 로 이미 export → 설치 스크립트가 그 버전을 집음
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro (${{ steps.suite.outputs.label }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          # target 미지정(기본 AOSP) — google_apis 는 Firebase 실 init(네트워크)으로 스플래시 부팅이 느려져
          # 웰컴 대기(~2분)를 간헐 초과했다(BB-384 실측: AOSP 5/5 vs google_apis 3/5). e2e 는 UI·절차만
          # 검증하므로(§8.4) Firebase 실동작이 불필요하므로 AOSP 로 결정적·빠른 부팅을 택한다
          profile: pixel_6
          disable-animations: true
          script: |
            # 로케일 en-US 강제 — ko면 Gboard 한국어 자판이 inputText ASCII를 한글로 조합 (§8.3 step 5)
            # best-effort(|| true): 시나리오는 로케일 무관 설계라 로케일 write 실패가 job 을 죽이지 않도록
            adb shell settings put system system_locales en-US || true
            adb shell am force-stop com.google.android.inputmethod.latin || true
            adb install -r app.apk
            # preview 빌드(JS 번들 내장)엔 Metro 런처 화면이 없어 subflow 진입 스텝이 자동 스킵됨 (가시성 조건부, §8.3)
            maestro test ${{ steps.suite.outputs.tags }} .maestro

      - name: Upload Maestro report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-report-${{ steps.suite.outputs.label }}
          path: |
            ~/.maestro/tests
          if-no-files-found: ignore
          retention-days: 14

  notify-result:
    name: Notify Slack (Result)
    needs: e2e
    # 실패 시에만 알림 — success·skipped 는 소음이라 제외
    if: ${{ always() && needs.e2e.result == 'failure' }}
    uses: ./.github/workflows/_notify-slack.yml
    with:
      status: ${{ needs.e2e.result }}
      env: e2e
    secrets: inherit
