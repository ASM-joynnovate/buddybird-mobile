name: Production OTA
on:
  workflow_dispatch:
    inputs:
      force-update:
        description: Install the bundle as soon as the app opens and restart
        type: boolean
        default: false
      platform:
        description: Platform to deploy
        type: choice
        options: [all, ios, android]
        default: all
permissions:
  contents: read
concurrency:
  group: production-ota
  cancel-in-progress: false
jobs:
  ota:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ota.yml
    with:
      variant: production
      environment-name: 운영
      force-update: ${{ inputs.force-update }}
      platform: ${{ inputs.platform }}
    secrets:
      google-services-info-plist: ${{ secrets.GOOGLE_SERVICES_INFO_PLIST_PROD_BASE64 }}
      google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON_PROD_BASE64 }}
      signing-private-key: ${{ secrets.HOT_UPDATER_SIGNING_PRIVATE_KEY_PRODUCTION }}
      cloudflare-api-token: ${{ secrets.HOT_UPDATER_CLOUDFLARE_API_TOKEN }}
      r2-access-key-id: ${{ secrets.HOT_UPDATER_CLOUDFLARE_R2_ACCESS_KEY_ID }}
      r2-secret-access-key: ${{ secrets.HOT_UPDATER_CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      sentry-auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
