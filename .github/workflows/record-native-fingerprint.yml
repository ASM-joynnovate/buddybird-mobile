name: Record native fingerprint
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref of the submitted store build, e.g. v2.11.0
        type: string
        required: true
      variant:
        description: App variant of the store build
        type: choice
        options: [development, production]
        required: true
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - uses: ./.github/actions/native-fingerprint
        with:
          variant: ${{ inputs.variant }}
          ios-firebase-config: ${{ inputs.variant == 'production' && secrets.GOOGLE_SERVICES_INFO_PLIST_PROD_BASE64 || secrets.GOOGLE_SERVICES_INFO_PLIST_DEV_BASE64 }}
          android-firebase-config: ${{ inputs.variant == 'production' && secrets.GOOGLE_SERVICES_JSON_PROD_BASE64 || secrets.GOOGLE_SERVICES_JSON_DEV_BASE64 }}
          github-token: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-fingerprint-${{ inputs.variant }}
          path: ${{ runner.temp }}/native-fingerprint/
          retention-days: 90
