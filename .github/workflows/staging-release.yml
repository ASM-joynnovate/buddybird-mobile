name: Staging release
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build again, e.g. v1.2.0
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: staging-release
  cancel-in-progress: false
jobs:
  notify-started:
    runs-on: ubuntu-latest
    outputs:
      started_at: ${{ steps.range.outputs.started_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - id: range
        env:
          TAG: ${{ inputs.tag }}
        run: |
          previous=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/notify-slack
        continue-on-error: true
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          title: 🚀 buddybird-mobile staging 릴리스 시작 ${{ inputs.tag }}
          fields: |
            태그=${{ inputs.tag }}
            실행자=${{ github.actor }}
            트리거=${{ github.event_name }}
          buttons: |
            실행 로그=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            GitHub Release=${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.tag }}
          commit-range: ${{ steps.range.outputs.previous }}..${{ inputs.tag }}

  staging-build-and-submit:
    uses: ./.github/workflows/eas-build-and-submit.yml
    with:
      profile: staging
      tag: ${{ inputs.tag }}
    secrets: inherit # zizmor: ignore[secrets-inherit]

  android-e2e:
    name: Android E2E (Maestro)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Prepare dev Firebase identity
        env:
          DEV_IOS: ${{ secrets.GOOGLE_SERVICES_INFO_PLIST_DEV_BASE64 }}
          DEV_ANDROID: ${{ secrets.GOOGLE_SERVICES_JSON_DEV_BASE64 }}
        run: |
          test -n "$DEV_IOS"
          test -n "$DEV_ANDROID"
          mkdir -p config/dev/firebase
          printf '%s' "$DEV_IOS" | base64 -d > config/dev/firebase/GoogleService-Info.plist
          printf '%s' "$DEV_ANDROID" | base64 -d > config/dev/firebase/google-services.json
      - name: Build release APK for the emulator
        env:
          APP_VARIANT: development
        run: |
          npx expo prebuild --platform android --no-install
          android/gradlew -p android :app:assembleRelease -PreactNativeArchitectures=x86_64
      - name: Install Maestro
        env:
          MAESTRO_VERSION: 2.10.0
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "120000"
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            maestro test --include-tags full --debug-output .e2e/results .maestro
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: maestro-${{ inputs.tag }}
          path: |
            .e2e/results
            *.png
          if-no-files-found: ignore
          retention-days: 14

  notify-finished:
    needs: [notify-started, staging-build-and-submit, android-e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: duration
        env:
          STARTED_AT: ${{ needs.notify-started.outputs.started_at }}
        run: |
          elapsed=$(( $(date +%s) - ${STARTED_AT:-$(date +%s)} ))
          echo "value=$(( elapsed / 60 ))m $(( elapsed % 60 ))s" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/notify-slack
        continue-on-error: true
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          title: "${{ needs.staging-build-and-submit.result == 'success' && needs.android-e2e.result == 'success' && '✅ buddybird-mobile staging 릴리스 완료' || contains(needs.*.result, 'failure') && '❌ buddybird-mobile staging 릴리스 실패' || '⚠️ buddybird-mobile staging 릴리스 취소' }} ${{ inputs.tag }}"
          fields: |
            태그=${{ inputs.tag }}
            staging=${{ needs.staging-build-and-submit.result }}
            e2e=${{ needs.android-e2e.result }}
            소요 시간=${{ steps.duration.outputs.value }}
          buttons: |
            실행 로그=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            GitHub Release=${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.tag }}
