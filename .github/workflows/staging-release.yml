name: Staging release
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build again, e.g. v1.2.0
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: staging-release
  cancel-in-progress: false
jobs:
  notify-started:
    runs-on: ubuntu-latest
    outputs:
      started_at: ${{ steps.range.outputs.started_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - id: range
        env:
          TAG: ${{ inputs.tag }}
        run: |
          previous=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/notify-slack
        continue-on-error: true
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          title: 🚀 buddybird-mobile staging 릴리스 시작 ${{ inputs.tag }}
          fields: |
            태그=${{ inputs.tag }}
            실행자=${{ github.actor }}
            트리거=${{ github.event_name }}
          buttons: |
            실행 로그=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            GitHub Release=${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.tag }}
          commit-range: ${{ steps.range.outputs.previous }}..${{ inputs.tag }}

  staging-build-and-submit:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/eas-build-and-submit.yml
    with:
      profile: staging
      ref: refs/tags/${{ inputs.tag }}
    secrets: inherit # zizmor: ignore[secrets-inherit]

  notify-finished:
    needs: [notify-started, staging-build-and-submit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: duration
        env:
          STARTED_AT: ${{ needs.notify-started.outputs.started_at }}
        run: |
          elapsed=$(( $(date +%s) - ${STARTED_AT:-$(date +%s)} ))
          echo "value=$(( elapsed / 60 ))m $(( elapsed % 60 ))s" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/notify-slack
        continue-on-error: true
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          title: "${{ needs.staging-build-and-submit.result == 'success' && '✅ buddybird-mobile staging 릴리스 완료' || contains(needs.*.result, 'failure') && '❌ buddybird-mobile staging 릴리스 실패' || '⚠️ buddybird-mobile staging 릴리스 취소' }} ${{ inputs.tag }}"
          fields: |
            태그=${{ inputs.tag }}
            staging=${{ needs.staging-build-and-submit.result }}
            소요 시간=${{ steps.duration.outputs.value }}
          buttons: |
            실행 로그=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            GitHub Release=${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.tag }}
