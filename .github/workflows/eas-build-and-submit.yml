name: EAS build and submit
on:
  workflow_call:
    inputs:
      profile:
        type: string
        required: true
      ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      EAS_PROFILE: ${{ inputs.profile }}
      RELEASE_REF: ${{ inputs.ref }}
      NATIVE_VARIANT: ${{ inputs.profile == 'production' && 'production' || 'development' }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - run: npm install --global eas-cli@24.8.0 # zizmor: ignore[adhoc-packages]
      - name: Prepare Firebase identity for EAS configuration
        env:
          DEV_IOS: ${{ secrets.GOOGLE_SERVICES_INFO_PLIST_DEV_BASE64 }}
          DEV_ANDROID: ${{ secrets.GOOGLE_SERVICES_JSON_DEV_BASE64 }}
          PROD_IOS: ${{ secrets.GOOGLE_SERVICES_INFO_PLIST_PROD_BASE64 }}
          PROD_ANDROID: ${{ secrets.GOOGLE_SERVICES_JSON_PROD_BASE64 }}
        run: |
          variant=dev
          ios_config="$DEV_IOS"
          android_config="$DEV_ANDROID"
          if [ "$EAS_PROFILE" = production ]; then
            variant=prod
            ios_config="$PROD_IOS"
            android_config="$PROD_ANDROID"
          fi
          test -n "$ios_config"
          test -n "$android_config"
          mkdir -p "config/$variant/firebase"
          printf '%s' "$ios_config" | base64 -d > "config/$variant/firebase/GoogleService-Info.plist"
          printf '%s' "$android_config" | base64 -d > "config/$variant/firebase/google-services.json"
      - name: Build both store binaries
        run: |
          eas build --platform all --profile "$EAS_PROFILE" --non-interactive \
            --wait --json --message "$RELEASE_REF" > "$RUNNER_TEMP/builds.json"
      - name: Submit binaries to the stores
        env:
          PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_BASE64 }}
          APPLE_KEY: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          test -n "$PLAY_KEY"
          test -n "$APPLE_KEY"
          umask 077
          trap 'rm -f /tmp/play-service-account.json /tmp/asc-api-key.p8' EXIT
          printf '%s' "$PLAY_KEY" | base64 -d > /tmp/play-service-account.json
          printf '%s' "$APPLE_KEY" | base64 -d > /tmp/asc-api-key.p8
          for platform in android ios; do
            build_id=$(jq -er --arg platform "$platform" \
              '.[] | select((.platform | ascii_downcase) == $platform) | .id | select(type == "string" and length > 0)' "$RUNNER_TEMP/builds.json")
            eas submit --platform "$platform" --profile "$EAS_PROFILE" --id "$build_id" --non-interactive --wait
          done
      - uses: ./.github/actions/native-fingerprint
        with:
          variant: ${{ env.NATIVE_VARIANT }}
          ios-firebase-config: ${{ inputs.profile == 'production' && secrets.GOOGLE_SERVICES_INFO_PLIST_PROD_BASE64 || secrets.GOOGLE_SERVICES_INFO_PLIST_DEV_BASE64 }}
          android-firebase-config: ${{ inputs.profile == 'production' && secrets.GOOGLE_SERVICES_JSON_PROD_BASE64 || secrets.GOOGLE_SERVICES_JSON_DEV_BASE64 }}
          github-token: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-fingerprint-${{ env.NATIVE_VARIANT }}
          path: ${{ runner.temp }}/native-fingerprint/
          retention-days: 90
