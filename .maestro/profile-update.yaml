appId: com.joynnovate.buddybird.dev
name: Edited profile persists and feedback can be cancelled
tags: [smoke, full]
---
- runFlow: helpers/fresh-profile.yaml
- tapOn:
    id: tab-profile
- scrollUntilVisible:
    element:
      id: profile-edit
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: profile-edit
- assertVisible:
    id: profile-name
    text: E2E Parrot
- tapOn:
    id: profile-name
- eraseText
- inputText: Updated Parrot
- tapOn: Edit profile
- scrollUntilVisible:
    element:
      id: birthday-unknown
    direction: DOWN
    centerElement: true
- tapOn:
    id: birthday-unknown
- assertVisible:
    id: birthday-unknown
    selected: false
- scrollUntilVisible:
    element:
      id: profile-save
    direction: DOWN
- tapOn:
    id: profile-save
- extendedWaitUntil:
    notVisible:
      id: profile-save
    timeout: 15000
- runFlow: helpers/restart-app.yaml
- tapOn:
    id: tab-profile
- assertVisible:
    id: profile-display-name
    text: Updated Parrot
- assertVisible: Budgie
- assertVisible:
    id: profile-birth-date
    text: '[0-9]{4}\. [0-9]{1,2}\. [0-9]{1,2}\.'
- takeScreenshot: profile-birth-date
- scrollUntilVisible:
    element:
      id: profile-feedback
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: profile-feedback
- assertVisible:
    id: feedback-send
    enabled: false
- tapOn:
    id: feedback-message
- inputText: This message will be cancelled.
- scrollUntilVisible:
    element:
      id: feedback-send
    direction: DOWN
- assertVisible:
    id: feedback-send
    enabled: true
- tapOn: Cancel
- assertNotVisible:
    id: feedback-message
- assertVisible:
    id: tab-profile
    selected: true
