# 시나리오 05 — 단어 생성: 사용자가 직접 단어를 만들 수 있다 (절차 + 저장 CRUD)
# 한계: 오디오 내용은 검증 불가 — 에뮬레이터 무음 녹음도 통과 (최소 길이·레벨 게이트 없음 확인됨)
# 녹음 최소 길이는 상태 라벨의 경과 타이머(≥0:02) 표시 대기로 보장 — 시간이 아니라 관찰된 상태 기준
appId: com.joynnovate.buddybird.dev
tags:
  - smoke
---
- runFlow: ../subflows/complete-onboarding.yaml
- tapOn:
    id: "tab-words"
- assertVisible: "Hello"
- tapOn:
    id: "word-add-cta"
- extendedWaitUntil:
    visible:
      id: "word-label-input"
    timeout: 10000
- tapOn:
    id: "word-label-input"
- inputText: "Bori"
- hideKeyboard
# 녹음 시작 → 경과 타이머 ≥0:02 표시(2초 이상 녹음 보장) → 정지
# 0:02 단일 값은 1초만 표시돼 폴링이 놓치면 영영 미매칭 — 0:02~0:59 범위로 창을 넓힘
- tapOn:
    id: "word-record-toggle"
- extendedWaitUntil:
    visible: ".*0:(0[2-9]|[1-5][0-9]).*"
    timeout: 15000
- tapOn:
    id: "word-record-toggle"
# recorded 상태 진입 → 미리듣기 행 표시 + 저장 활성 (녹음+이름 조건 로직 검증)
- extendedWaitUntil:
    visible:
      id: "word-preview-toggle"
    timeout: 10000
- assertVisible:
    id: "word-save"
    enabled: true
- tapOn:
    id: "word-save"
# 모달 닫힘(저장 완료) → 목록에 새 단어 표시
- extendedWaitUntil:
    notVisible:
      id: "word-label-input"
    timeout: 10000
- assertVisible: "Bori"
