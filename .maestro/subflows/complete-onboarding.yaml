# 공통 subflow: 신규 사용자 온보딩 완주 (clearState = fresh install 재현)
# 이름은 ASCII "Mango" — Android IME 한글 inputText flaky 회피 (한글 검증은 시드 단어 렌더링 assert가 커버)
appId: com.joynnovate.buddybird.dev
---
- stopApp
- clearState
- launchApp:
    stopApp: false
    permissions:
      microphone: allow
      notifications: allow
# [dev-client 전용 진입 — 빌드 종류로 자동 분기] debug(dev-client) 빌드는 clearState 시 Metro 연결 정보도
# 지워져 런처 화면에 멈춤 → 런처가 자동 감지한 Metro 서버(호스트 10.0.2.2:8081) 행을 탭해 번들 로드.
# (openLink 딥링크는 launchApp 직후 인텐트가 유실되는 타이밍 이슈가 있어 UI 탭 방식 사용)
# preview/release 빌드(JS 번들 내장)엔 런처 화면이 없다 → Metro 행이 끝내 안 뜨므로 helper의 tapOn(optional)은
# 대기 타임아웃 후 실패 없이 그냥 진행된다. env 플래그 없이 Metro 행 존재 여부로 debug/CI를 가른다 (BB-384).
# 에뮬레이터 ANR 다이얼로그("대기"/"Wait")가 무작위로 뜰 수 있어 helper가 정리하며 대기한다.
- runFlow: ../subflows/enter-metro-if-present.yaml
# Android CI에서 pm clear 직후 남은 task 제거가 새 MainActivity 프로세스를 kill할 수 있다.
# 첫 launch window 뒤에도 웰컴이 없으면 clearState 없이 한 번만 재launch하고 Metro 진입만 다시 시도한다.
- runFlow:
    when:
      notVisible:
        id: "onboarding-welcome-cta"
    commands:
      - launchApp:
          stopApp: false
          permissions:
            microphone: allow
            notifications: allow
      - runFlow: ../subflows/enter-metro-if-present.yaml
# 웰컴 도달까지 방해 요소를 반복 정리하는 자가 회복 루프 (등장 타이밍이 전부 비결정적이라 순서 고정 불가):
# - dev menu 인트로(clearState마다, 등장 시점 가변) → Continue
# - dev menu 본체(인트로 닫은 뒤 열린 채 남음) → back
# - 앱 업데이트 모달(리모트 컨피그 fetch 타이밍 의존) → 닫기
# - 에뮬레이터 ANR 다이얼로그(ko/en) → 대기/Wait
# dev menu(Continue/Reload)는 dev-client 전용이라 preview 빌드엔 노출 안 됨 → when:visible 가드로 자동 무시
# 오버레이 윈도우가 떠 있는 동안 웰컴 CTA는 hierarchy에 노출되지 않으므로 루프 종료 조건이 안전함
- repeat:
    times: 60
    while:
      notVisible:
        id: "onboarding-welcome-cta"
    commands:
      - runFlow:
          when:
            visible: "Continue"
          commands:
            - tapOn: "Continue"
      - runFlow:
          when:
            visible: "Reload"
          commands:
            - pressKey: back
      - runFlow:
          when:
            visible:
              id: "app-update-close"
          commands:
            - tapOn:
                id: "app-update-close"
      - runFlow:
          when:
            visible: "대기"
          commands:
            - tapOn: "대기"
      - runFlow:
          when:
            visible: "Wait"
          commands:
            - tapOn: "Wait"
- assertVisible:
    id: "onboarding-welcome-cta"
- tapOn:
    id: "onboarding-welcome-cta"
- assertVisible:
    id: "onboarding-name-input"
- tapOn:
    id: "onboarding-name-input"
- inputText: "Mango"
- hideKeyboard
- tapOn:
    id: "species-chip-budgie"
- tapOn:
    id: "onboarding-profile-submit"
# 제출 → saveProfile → 프로필 게이트 전환(온보딩 폼 소멸)까지 대기 — 공통 꼬리 (각 플로우 중복 제거)
- extendedWaitUntil:
    notVisible:
      id: "onboarding-name-input"
    timeout: 15000
# 오디오 수집 동의 팝업(BB-245) 닫기 — clearState 상태에선 항상 표출, dismissable 아님.
# 표출 시점은 업데이트 판정(네트워크) 완료 뒤라 비결정적 → 대기 후 거부 탭.
# 거부 선택: 05·06의 실제 녹음이 수집 대상이 되지 않도록. 거부해도 앱 동작 차이 없음
- extendedWaitUntil:
    visible:
      id: "upload-consent-deny"
    timeout: 15000
- tapOn:
    id: "upload-consent-deny"
- extendedWaitUntil:
    notVisible:
      id: "upload-consent-deny"
    timeout: 5000
